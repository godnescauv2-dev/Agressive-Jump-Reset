name: Build JumpReset Mod

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Setup Forge workspace
        run: |
          chmod +x gradlew
          ./gradlew setupDecompWorkspace --no-daemon

      - name: Build mod
        run: |
          ./gradlew build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v3
        with:
          name: JumpReset-Mod
          path: build/libs/*.jar
